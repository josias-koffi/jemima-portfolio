name: CI

on:
  pull_request:
  push:
    branches-ignore: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
      PAYLOAD_SECRET: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test:int
      - name: Import map à jour
        run: |
          pnpm generate:importmap
          git diff --exit-code -- 'src/app/(payload)/admin/importMap.js'
      - run: pnpm build
