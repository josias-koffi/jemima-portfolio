name: Deploy

# Déploiement par la plateforme josias-koffi/infra, piloté par .deploy/manifest.yaml.
#
#   push sur develop  → staging, automatiquement
#   production        → uniquement à la main (Actions → Deploy → Run workflow,
#                       branche main, environment = production). Un push ne
#                       déploie jamais la prod.
#   image_tag         → redéployer ou revenir à un tag déjà construit
#                       (promouvoir en prod le tag validé en staging)
#   plan_only         → afficher le plan sans rien appliquer

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environnement cible (production : lancer depuis main)"
        required: true
        default: staging
        type: choice
        options: [staging, production]
      image_tag:
        description: "Tag d'image à déployer (sha court). Vide : construit le commit courant."
        required: false
        type: string
      plan_only:
        description: "Afficher le plan sans rien appliquer"
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/josias-koffi/jemima-portfolio

jobs:
  resolve:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.target.outputs.image_tag }}
    steps:
      - id: target
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${INPUT_IMAGE_TAG:-${GITHUB_SHA:0:7}}"
          printf '%s' "${IMAGE_TAG}" | grep -qE '^[0-9a-f]{7,40}$' || { echo "image_tag doit être un sha." >&2; exit 1; }
          echo "image_tag=${IMAGE_TAG}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build & push image
    if: inputs.image_tag == ''
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=sha,prefix=,format=short
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:cache
          cache-to: type=registry,ref=${{ env.IMAGE }}:cache,mode=max

  # Démarre l'image contre un Postgres jetable avant tout déploiement : les
  # migrations Payload tournent au boot, un crash ici ne doit jamais atteindre
  # un environnement.
  verify-image:
    name: Boot the image
    needs: [resolve, build]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verify
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U verify"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Start the image
        run: |
          docker run -d --name app-verify --network host \
            -e PORT=3000 \
            -e DATABASE_URL=postgres://verify:verify@127.0.0.1:5432/verify \
            -e PAYLOAD_SECRET=verify-only-not-a-real-secret \
            -e SITE_URL=http://127.0.0.1:3000 -e SITE_ENV=staging \
            -e APP_VERSION=${{ needs.resolve.outputs.image_tag }} \
            "${IMAGE}:${{ needs.resolve.outputs.image_tag }}"
      - name: Wait for /api/health, then render the home page
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/api/health; then
              echo; echo "healthy after ${attempt} attempt(s)"
              curl -fsS -o /dev/null http://127.0.0.1:3000/ && echo "home: ok"
              curl -fsS -o /dev/null http://127.0.0.1:3000/admin/login && echo "admin: ok"
              exit 0
            fi
            sleep 2
          done
          echo "::error::L'image n'est jamais devenue saine."
          exit 1
      - name: Container logs
        if: always()
        run: docker logs app-verify 2>&1 | tail -80
      - if: always()
        run: docker rm -f app-verify


  deploy:
    name: Deploy
    needs: [resolve, verify-image]
    if: ${{ !failure() && !cancelled() }}
    uses: josias-koffi/infra/.github/workflows/deploy.yml@main
    with:
      environment: ${{ inputs.environment || 'staging' }}
      image_tag: ${{ needs.resolve.outputs.image_tag }}
      plan_only: ${{ inputs.plan_only == true }}
    secrets: inherit
